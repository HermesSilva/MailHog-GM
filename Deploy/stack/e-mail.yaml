version: '3.8'

# Stack de e-mail — MailHog-GM (fork "placebo do Gmail").
# Implantada pelo job `deploy` de .github/workflows/cd-email.yml, que define IMAGE
# com a tag do commit. O default permite deploy manual.

services:
  mailcrab: # Mantemos o nome para não quebrar o Nginx
    image: ${IMAGE:-ghcr.io/hermessilva/mailhog-gm:latest}
    hostname: mail.pildra.com.br
    networks:
      - tootega_public
    environment:
      # Persistência (maildir).
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/data
      # Hostname anunciado no EHLO/HELO e usado no cert TLS self-signed.
      - MH_HOSTNAME=mail.pildra.com.br
      # Autenticação nível Gmail (placebo): aceita qualquer credencial.
      - MH_SMTP_AUTH_ALLOW_ANY=true
      # Recusa (550) destinatários fora destes domínios.
      - MH_SMTP_ALLOWED_DOMAINS=pildra.com.br
    volumes:
      - /mnt/data/mailcrab:/data
    ports:
      # SMTP legado (mantido): MTA na 25, submissão alternativa na 2525.
      - target: 1025
        published: 25
        protocol: tcp
        mode: ingress
      - target: 1025
        published: 2525
        protocol: tcp
        mode: ingress
      # Submissão estilo Gmail (STARTTLS) na 587.
      - target: 1025
        published: 587
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      # O container novo sobe antes de o antigo parar: uma falha ao baixar a imagem
      # não derruba o SMTP.
      update_config:
        order: start-first
        failure_action: rollback
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  tootega_public:
    external: true
    name: tootega_public
