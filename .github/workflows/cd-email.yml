name: CI/Publish — MailHog-GM

# Compila o fork MailHog-GM, roda os testes de integração (envio + leitura de
# e-mail), publica a imagem no GHCR (ghcr.io/<owner>/mailhog-gm) e faz o deploy
# no Swarm via SSH. Secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY e
# STAGING_SSH_PASSPHRASE.

on:
  push:
    branches: [main, master]
    paths:
      - 'main.go'
      - 'Dockerfile'
      - 'vendor/**'
      - 'Deploy/stack/e-mail.yaml'
      - 'test/**'
      - '.github/workflows/cd-email.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mailhog-gm

jobs:
  # ============================================================
  # Testes de integração (gate): sobe MailHog-GM + testes C#
  # ============================================================
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + run integration tests (docker compose)
        shell: bash
        run: |
          set -e
          docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Tear down
        if: always()
        shell: bash
        run: docker compose down -v || true

  # ============================================================
  # Build + push da imagem para o GHCR
  # ============================================================
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="${{ env.REGISTRY }}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          DEV_TAG="${{ env.REGISTRY }}/${IMAGE_NAME}:dev"
          LATEST_TAG="${{ env.REGISTRY }}/${IMAGE_NAME}:latest"

          MAX_RETRIES=3; RETRY_COUNT=0
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Build attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            if docker build \
              -t "$SHA_TAG" -t "$DEV_TAG" -t "$LATEST_TAG" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              . ; then echo "Build succeeded!"; break; fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            [ $RETRY_COUNT -lt $MAX_RETRIES ] && { sleep 10; docker builder prune -f || true; }
          done
          [ $RETRY_COUNT -ge $MAX_RETRIES ] && { echo "Build failed after $MAX_RETRIES attempts"; exit 1; } || true

          RETRY_COUNT=0
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin
            if docker push "$SHA_TAG" && docker push "$DEV_TAG" && docker push "$LATEST_TAG"; then echo "Push succeeded!"; break; fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep 5
          done
          [ $RETRY_COUNT -ge $MAX_RETRIES ] && { echo "Push failed after $MAX_RETRIES attempts"; exit 1; } || true

  # ============================================================
  # Deploy no Swarm via SSH
  # Repositório público: os logs são públicos. Não imprimir aqui `docker service
  # logs`, que contêm endereços de e-mail.
  # ============================================================
  deploy:
    name: Deploy E-mail (Swarm)
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    concurrency: deploy-email
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          script: mkdir -p /opt/tootega/stacks

      - name: Copy e-mail stack to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          source: "Deploy/stack/e-mail.yaml"
          target: "/opt/tootega/stacks/"
          strip_components: 2

      - name: Deploy MailHog-GM to Swarm
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/hermessilva/mailhog-gm:${{ needs.build-push.outputs.version }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          envs: DEPLOY_IMAGE
          script: |
            set -e
            TARGET_STACK="mailhog"
            IMAGE="${DEPLOY_IMAGE}"
            echo "Imagem: ${IMAGE}"

            # Rede overlay compartilhada (reaproveitada)
            docker network create --driver overlay tootega_public 2>/dev/null || true

            # Credenciais isoladas: um login vencido em ~/.docker/config.json (ex.: um
            # GITHUB_TOKEN de outro CD) pode ser recusado até em pacote público, e o
            # Swarm reporta isso como "No such image". O pacote é público.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT

            # Baixa antes de alterar o serviço: se falhar, nada muda no servidor.
            PULL_OK=0
            for i in 1 2 3 4 5; do
              if docker pull "${IMAGE}"; then PULL_OK=1; break; fi
              echo "Pull ${i}/5 falhou, aguardando 5s..."; sleep 5
            done
            if [ "$PULL_OK" != "1" ]; then
              echo "ERRO: nao foi possivel baixar ${IMAGE}."
              exit 1
            fi

            IMAGE="${IMAGE}" docker stack deploy \
              -c /opt/tootega/stacks/e-mail.yaml \
              --with-registry-auth \
              "${TARGET_STACK}"

            # Health check: exige um único container, com a imagem implantada, API no
            # ar e filtro de domínio ativo. Só testar a API aprovaria o container antigo
            # em uma atualização que falhou ou sofreu rollback.
            echo "=== Health Check ==="
            EXPECTED_ID=$(docker image inspect "${IMAGE}" --format '{{.Id}}')
            RETRIES=12
            COUNT=0
            until [ $COUNT -ge $RETRIES ]; do
              CID=$(docker ps -q -f name="${TARGET_STACK}_mailcrab" -f status=running 2>/dev/null)
              if [ "$(echo "$CID" | wc -w)" = "1" ] \
                && [ "$(docker inspect "$CID" --format '{{.Image}}')" = "$EXPECTED_ID" ] \
                && docker exec "$CID" wget -q -O - http://127.0.0.1:8025/api/v2/messages >/dev/null 2>&1 \
                && docker logs "$CID" 2>&1 | grep -q "Filtro de dom"; then
                echo "MailHog-GM no ar com ${IMAGE} e filtro de domínio ativo."
                break
              fi
              COUNT=$((COUNT + 1))
              echo "Tentativa $COUNT/$RETRIES falhou, aguardando 10s..."
              sleep 10
            done

            if [ $COUNT -ge $RETRIES ]; then
              echo "ERRO: health check não passou após $RETRIES tentativas."
              docker service ps "${TARGET_STACK}_mailcrab" --format '{{.CurrentState}} {{.Error}}' 2>/dev/null | head -5 || true
              exit 1
            fi

      - name: Purge unused images on deploy host
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          script: |
            docker image prune -af >/dev/null 2>&1 || true
